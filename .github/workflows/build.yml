name: Build and package STATEMENT_DIGEST plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@main
    with:
      plugin_name: statement-digest
      plugin_directory: statement_digest
      build_target: statement_digest
      plugin_library: statement_digest.so

      sdk_image: quay.io/lefred14/mariadb-plugin-build
      mariadb_versions: |
          13.0.2
          13.1.1
          
      cmake_options: -DPLUGIN_DATE_EXTRA=DYNAMIC
      test_suite: statement_digest
      run_tests: false
