name: Build and package STATEMENT_DIGEST plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: statement-digest
      plugin_directory: statement_digest
      build_target: statement_digest
      plugin_library: statement_digest.so

      mariadb_versions: |
          13.0.2
          13.1.1
          
      cmake_options: -DPLUGIN_STATEMENT_DIGEST=DYNAMIC
      test_suite: statement_digest
      run_tests: false
